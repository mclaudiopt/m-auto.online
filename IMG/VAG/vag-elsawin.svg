<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ELSA Win — Volkswagen Group Workshop Manuals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- open manual / book -->
  <g transform="translate(400,225)">
    <path d="M-140,-70 L-10,-55 L-10,95 L-140,80 Z" fill="#e2e8f0"/>
    <path d="M140,-70 L10,-55 L10,95 L140,80 Z" fill="#f8fafc"/>
    <path d="M-140,-70 L-10,-55 L10,-55 L140,-70 L140,-58 L10,-43 L-10,-43 L-140,-58 Z" fill="#94a3b8"/>
    <line x1="-115" y1="-30" x2="-25" y2="-22" stroke="#94a3b8" stroke-width="4"/>
    <line x1="-115" y1="0" x2="-25" y2="8" stroke="#94a3b8" stroke-width="4"/>
    <line x1="-115" y1="30" x2="-25" y2="38" stroke="#94a3b8" stroke-width="4"/>
    <line x1="25" y1="-22" x2="115" y2="-30" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="25" y1="8" x2="115" y2="0" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="25" y1="38" x2="115" y2="30" stroke="#cbd5e1" stroke-width="4"/>
  </g>

  <!-- VW badge -->
  <circle cx="400" cy="118" r="34" fill="#0f172a" stroke="#2563eb" stroke-width="4"/>
  <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">VW</text>

  <!-- label plate -->
  <rect x="60" y="40" width="180" height="34" rx="6" fill="#2563eb"/>
  <text x="75" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">VOLKSWAGEN</text>

  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#f8fafc">ELSA Win</text>
  <text x="400" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#93c5fd" letter-spacing="0.5">MANUAIS TÉCNICOS · VW · AUDI · SEAT · ŠKODA</text>
</svg>
