<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MbTools — Mercedes-Benz Coding Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- toolbox -->
  <g transform="translate(400,230)">
    <rect x="-120" y="-30" width="240" height="110" rx="10" fill="#e2e8f0"/>
    <rect x="-120" y="-30" width="240" height="26" rx="10" fill="#94a3b8"/>
    <rect x="-30" y="-58" width="60" height="34" rx="8" fill="none" stroke="#e2e8f0" stroke-width="10"/>
    <circle cx="-70" cy="35" r="10" fill="#2563eb"/>
    <circle cx="0" cy="35" r="10" fill="#2563eb"/>
    <circle cx="70" cy="35" r="10" fill="#2563eb"/>
  </g>

  <!-- mercedes star badge -->
  <g transform="translate(400,120)">
    <circle r="30" fill="#0f172a" stroke="#2563eb" stroke-width="4"/>
    <g stroke="#f8fafc" stroke-width="3">
      <circle r="20" fill="none"/>
      <line x1="0" y1="-20" x2="0" y2="12"/>
      <line x1="-17" y1="7" x2="9" y2="-15"/>
      <line x1="17" y1="7" x2="-9" y2="-15"/>
    </g>
  </g>

  <rect x="40" y="40" width="220" height="34" rx="6" fill="#2563eb"/>
  <text x="55" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">MERCEDES-BENZ</text>

  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#f8fafc">MbTools</text>
  <text x="400" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#93c5fd" letter-spacing="0.5">FERRAMENTAS DE CODIFICAÇÃO</text>
</svg>
