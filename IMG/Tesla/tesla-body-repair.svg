<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tesla Body Repair Procedures">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b0d"/>
      <stop offset="100%" stop-color="#1a1a1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e11d2e" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e11d2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- car silhouette -->
  <g transform="translate(400,205)">
    <path d="M-160,40 Q-150,-10 -95,-30 L-55,-55 Q-10,-70 55,-55 L100,-30 Q150,-10 160,40 L160,60 L-160,60 Z" fill="#e5e7eb"/>
    <path d="M-95,-30 L-55,-55 Q-10,-70 55,-55 L100,-30 Z" fill="#3f3f46" opacity="0.85"/>
    <circle cx="-95" cy="62" r="26" fill="#111114" stroke="#71717a" stroke-width="4"/>
    <circle cx="95" cy="62" r="26" fill="#111114" stroke="#71717a" stroke-width="4"/>
  </g>

  <!-- wrench badge -->
  <g transform="translate(400,110)">
    <circle r="34" fill="#0f0f11" stroke="#e11d2e" stroke-width="4"/>
    <path d="M-14,-14 a12,12 0 1 1 -3,12 L-30,15 l-8,8 l7,7 l8,-8 l17,-17 a12,12 0 0 1 12,-15 z" fill="#f8fafc" transform="scale(0.9)"/>
  </g>

  <rect x="40" y="40" width="180" height="34" rx="6" fill="#e11d2e"/>
  <text x="55" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">TESLA</text>

  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">Body Repair Procedures</text>
  <text x="400" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#f87171" letter-spacing="0.5">MANUAL OFICIAL DE REPARAÇÃO ESTRUTURAL</text>
</svg>
