<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Getac K120G2 Rugged Tablet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- rugged tablet -->
  <g transform="translate(400,225)">
    <rect x="-135" y="-100" width="270" height="200" rx="20" fill="#3f3f46"/>
    <rect x="-118" y="-84" width="236" height="168" rx="6" fill="#0f172a"/>
    <rect x="-100" y="-66" width="200" height="132" rx="2" fill="#1e3a5f"/>
    <path d="M-70,10 l24,24 l48,-48" stroke="#4ade80" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- corner bumpers -->
    <rect x="-146" y="-111" width="30" height="30" rx="8" fill="#d97706"/>
    <rect x="116" y="-111" width="30" height="30" rx="8" fill="#d97706"/>
    <rect x="-146" y="81" width="30" height="30" rx="8" fill="#d97706"/>
    <rect x="116" y="81" width="30" height="30" rx="8" fill="#d97706"/>
    <!-- handle -->
    <rect x="-30" y="-124" width="60" height="14" rx="7" fill="#71717a"/>
  </g>

  <rect x="40" y="40" width="150" height="34" rx="6" fill="#d97706"/>
  <text x="55" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">GETAC</text>

  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Tablet K120G2</text>
  <text x="400" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#fbbf24" letter-spacing="0.5">RUGGED · MIL-STD-810H · IP65</text>
</svg>
