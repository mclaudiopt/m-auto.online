<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BMW Service Manuals Collection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0053a0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0053a0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- stacked manuals -->
  <g transform="translate(400,240)">
    <rect x="-110" y="20" width="220" height="26" rx="4" fill="#94a3b8"/>
    <rect x="-100" y="-8" width="200" height="26" rx="4" fill="#cbd5e1"/>
    <rect x="-90" y="-36" width="180" height="26" rx="4" fill="#e2e8f0"/>
    <text x="0" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">E39 · E46</text>
    <text x="0" y="-19" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">E30 SERIES</text>
  </g>

  <rect x="40" y="40" width="120" height="34" rx="6" fill="#0053a0"/>
  <text x="55" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">BMW</text>

  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">Service Manuals</text>
  <text x="400" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#93c5fd" letter-spacing="0.5">E30 · E36 · E39 · E46 · E60</text>
</svg>
