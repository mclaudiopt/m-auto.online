<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jaguar EPC 2018 — Catálogo Eletrónico de Peças">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#1e5c3a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e5c3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- exploded parts diagram -->
  <g transform="translate(400,225)" stroke="#72b08a" stroke-width="3" fill="none">
    <rect x="-90" y="-70" width="180" height="50" rx="6" fill="#e2e8f0" stroke="none"/>
    <circle cx="-40" cy="10" r="22" fill="#e2e8f0" stroke="none"/>
    <circle cx="40" cy="10" r="22" fill="#e2e8f0" stroke="none"/>
    <rect x="-70" y="55" width="140" height="30" rx="6" fill="#e2e8f0" stroke="none"/>
    <line x1="0" y1="-20" x2="0" y2="0"/>
    <line x1="-40" y1="-12" x2="-40" y2="-12"/>
    <line x1="0" y1="30" x2="0" y2="55"/>
  </g>

  <rect x="40" y="40" width="120" height="34" rx="6" fill="#1e5c3a"/>
  <text x="55" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">JAGUAR</text>

  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">EPC 2018</text>
  <text x="400" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#72b08a" letter-spacing="0.5">CATÁLOGO ELETRÓNICO DE PEÇAS</text>
</svg>
