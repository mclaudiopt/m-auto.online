<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subaru Select Monitor SSM4 — Diagnóstico Oficial">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#003da5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#003da5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- tablet de diagnostico com forma de onda -->
  <g transform="translate(400,225)">
    <rect x="-110" y="-75" width="220" height="150" rx="14" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="-92" y="-58" width="184" height="100" rx="4" fill="#1e293b"/>
    <polyline points="-80,10 -55,10 -40,-25 -20,35 0,-15 20,10 80,10" fill="none" stroke="#6b93d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="60" r="6" fill="#334155"/>
  </g>

  <rect x="40" y="40" width="150" height="34" rx="6" fill="#003da5"/>
  <text x="55" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">SUBARU</text>

  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#f8fafc">SSM4</text>
  <text x="400" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#6b93d6" letter-spacing="0.5">DIAGNÓSTICO OFICIAL</text>
</svg>
