function waLink(phone) {
  const digits = phone.replace(/\D/g, "");
  const full = digits.startsWith("351") ? digits : "351" + digits;
  const text = encodeURIComponent(MESSAGE_TEMPLATE);
  return `https://wa.me/${full}?text=${text}`;
}

// Portuguese mobile numbers start with 9 (91x/92x/93x/96x) — only those can plausibly have WhatsApp.
// Fixed/landline numbers start with 2 (21x Lisboa, 22x Porto, 23x Coimbra, 26x Leiria/Oeste, 28x
// Faro, 29x Açores/Madeira, etc.) and never do, so no "Abrir WhatsApp" button is shown for those —
// just the number itself, to call directly, avoiding a broken/misleading WhatsApp link.
function isMobile(phone) {
  const digits = phone.replace(/\D/g, "").replace(/^351/, "");
  return digits.startsWith("9");
}

document.getElementById("msgPreview").textContent = MESSAGE_TEMPLATE;

document.getElementById("progressText").textContent =
  `${CONTACTS.length} oficinas com WhatsApp confirmado nesta lista. Novas entram aqui assim que tiverem telemóvel confirmado — a pesquisa de mais números continua em segundo plano.`;

function safeGetSent(key) { try { return localStorage.getItem(key) === "1"; } catch { return false; } }
function safeSetSent(key) { try { localStorage.setItem(key, "1"); } catch {} }
function safeClearSent(key) { try { localStorage.removeItem(key); } catch {} }

const rowsEl = document.getElementById("rows");
rowsEl.innerHTML = CONTACTS.map(c => {
  const sentKey = "mauto_wa_sent_" + c.id;
  // A contact already marked sentAt in the database (i.e. really sent today) counts as done
  // regardless of this browser's localStorage — that only remembers extra manual toggles.
  const alreadySent = !!c.sentAt || safeGetSent(sentKey);
  return `<tr id="row-${c.id}" class="${alreadySent ? 'done' : ''}">
    <td>${c.name}</td>
    <td class="district">${c.district}</td>
    <td class="phone-cell">${c.phone}</td>
    <td>
      <a class="wa-btn" target="_blank" rel="noopener" href="${waLink(c.phone)}" onclick="markSent('${c.id}')">Abrir WhatsApp</a>
      <span class="mark-sent" onclick="toggleSent('${c.id}')">${alreadySent ? '↺ desmarcar' : ''}</span>
      ${c.sentAt ? `<span class="district">enviado ${c.sentAt}</span>` : ""}
    </td>
  </tr>`;
}).join("");

// Purely a per-viewer visual reminder (localStorage, this browser only) — dims a row once you've
// clicked its WhatsApp button, so it's easy to see at a glance which ones are left when you come
// back to this file later. Does not track whether the message was actually sent.
function markSent(id) {
  safeSetSent("mauto_wa_sent_" + id);
  const row = document.getElementById("row-" + id);
  if (row) row.classList.add("done");
}
function toggleSent(id) {
  safeClearSent("mauto_wa_sent_" + id);
  location.reload();
}

// "Abrir próximo" — runs in the USER's own browser (unlike anything Claude could open, this one is
// actually logged into their real WhatsApp/Beeper), so each click is a real user gesture opening one
// tab, which every browser allows without a popup-blocker fight. Finds the first mobile contact not
// yet marked as opened, opens its wa.me link, marks it, and updates the button for the next click.
const eligible = CONTACTS.filter(c => c.phone && isMobile(c.phone));
function isDone(c) {
  return !!c.sentAt || safeGetSent("mauto_wa_sent_" + c.id);
}
function nextUnsent() {
  return eligible.find(c => !isDone(c));
}
function updateNextButton() {
  const btn = document.getElementById("btnNext");
  const hint = document.getElementById("nextHint");
  const remaining = eligible.filter(c => !isDone(c));
  if (!remaining.length) {
    btn.disabled = true;
    btn.textContent = "✓ Todos abertos";
    hint.textContent = "Já abriste todos os contactos com telemóvel disponíveis nesta lista.";
    return;
  }
  btn.disabled = false;
  btn.textContent = `▶ Abrir próximo por enviar (${remaining.length} restantes)`;
  hint.textContent = `Próximo: ${remaining[0].name} (${remaining[0].district})`;
}
document.getElementById("btnNext").onclick = () => {
  const c = nextUnsent();
  if (!c) return;
  window.open(waLink(c.phone), "_blank", "noopener");
  markSent(c.id);
  updateNextButton();
};
updateNextButton();
</script>
